name: Initialize and Export Whole Chipyard Docker Image

on:
  workflow_dispatch: # 在 GitHub 网页上手动触发

jobs:
  build-and-save-image:
    runs-on: ubuntu-latest
    steps:
      - name: Run Initialization and Commit Container
        run: |
          # 1. 以后台/交互模式启动官方基础镜像，并给容器命名为 "chipyard_builder"
          docker run -d --name chipyard_builder --user root ucbbar/chipyard-image:latest sleep infinity
          
          # 2. 在容器内部执行初始化命令（联网拉取 ASAP7 和 OpenROAD 插件及 PDK）
          docker exec -u root chipyard_builder bash -c '
            # 自动定位容器内的 Chipyard 路径
            if [ -d "$HOME/chipyard" ]; then CP_PATH="$HOME/chipyard"
            elif [ -d "/root/chipyard" ]; then CP_PATH="/root/chipyard"
            else CP_PATH="/home/ubuntu/chipyard"; fi
            
            echo "Chipyard found at $CP_PATH"
            
            # 激活容器内的 Conda 环境
            if [ -f "$HOME/miniconda3/etc/profile.d/conda.sh" ]; then . "$HOME/miniconda3/etc/profile.d/conda.sh"
            elif [ -f "/root/miniconda3/etc/profile.d/conda.sh" ]; then . "/root/miniconda3/etc/profile.d/conda.sh"; fi
            conda activate base || echo "Conda activated"
            
            # 进入 Chipyard 目录，运行 VLSI 初始化脚本
            cd $CP_PATH
            ./scripts/init-vlsi.sh asap7 openroad
            
            # 构建初始环境配置文件 buildfile
            cd vlsi
            export HAMMER_HOME=$PWD/hammer
            source $HAMMER_HOME/sourceme.sh
            make buildfile tutorial=asap7-openroad
          '
          
          # 3. 将这个已经初始化好的容器“拍照”保存为一个全新的镜像，命名为 chipyard-vlsi:latest
          docker commit chipyard_builder chipyard-vlsi:latest
          
          # 4. 停止并清理临时容器
          docker rm -f chipyard_builder
          
          # 5. 创建输出目录，并将整个新镜像导出为离线 tar 包
          mkdir -p ${{ github.workspace }}/docker-export
          echo "Saving full docker image into tar file... This might take a few minutes."
          docker save chipyard-vlsi:latest -o ${{ github.workspace }}/docker-export/chipyard-vlsi-ready.tar

      - name: Upload Whole Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chipyard-vlsi-full-image
          path: ${{ github.workspace }}/docker-export/chipyard-vlsi-ready.tar
          retention-days: 5
