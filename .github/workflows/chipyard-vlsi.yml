name: Build and Export Chipyard via Dockerfile

on:
  workflow_dispatch:

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    steps:
      # 检出代码，让 GitHub 虚拟机能读到你的 Dockerfile
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 编译 Dockerfile 生成你的专属镜像 chipyard-vlsi-final:latest
      - name: Build Docker Image using Dockerfile
        run: |
          docker build -t chipyard-vlsi-final:latest -f .devcontainer/dockerfile2

      # 将整个镜像直接打包导出
      - name: Export Image to Tar
        run: |
          mkdir -p ${{ github.workspace }}/docker-export
          echo "Saving image to tar... This will take a few minutes."
          docker save chipyard-vlsi-final:latest -o ${{ github.workspace }}/docker-export/chipyard-vlsi-ready.tar

      # 上传为 Artifact 供你下载
      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chipyard-vlsi-main-image
          path: ${{ github.workspace }}/docker-export/chipyard-vlsi-ready.tar
          retention-days: 5
