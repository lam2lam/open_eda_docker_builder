name: Download Docker Image
on: [workflow_dispatch] # 允许手动点击触发
jobs:
  build-and-download:
    runs-on: ubuntu-latest
    steps:
    - name: Pull and Save Image
      run: |
        docker pull ucbbar/chisel-bootcamp:latest
        docker save ucbbar/chisel-bootcamp:latest -o chisel-bootcamp.tar
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: chisel-bootcamp-tarball
        path: chisel-bootcamp.tar
