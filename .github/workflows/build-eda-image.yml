name: Build and Package EDA Image for Chrome Download

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Build the Docker image locally on the runner
      - name: Build Docker Image
        run: |
          docker build -t open_eda_docker_builder:latest -f .devcontainer/Dockerfile .

      # 2. Archive the complete image into a single .tar file
      - name: Save Docker Image to Archive File
        run: |
          docker save open_eda_docker_builder:latest -o open_eda_docker_builder.tar

      # 3. Compress the archive to make the browser download much faster
      - name: Compress Tarball
        run: |
          gzip open_eda_docker_builder.tar

      # 4. Upload it to GitHub Actions Artifacts (Creates a direct Chrome download link)
      - name: Upload Image Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: open-eda-docker-image
          path: open_eda_docker_builder.tar.gz
          retention-days: 7 # Will be stored for a week
